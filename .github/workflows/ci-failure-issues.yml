name: Report CI failures

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing failed CI run ID to report
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read

# Serialize reports for the same source branch to avoid duplicate issues.
concurrency:
  group: ci-issues-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || inputs.run_id }}
  cancel-in-progress: false

jobs:
  report:
    name: Create or update failure issues
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    steps:
      # Execute only the trusted default-branch script, never PR code or artifacts.
      - name: Checkout notification code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Report failed checks
        uses: actions/github-script@v7
        env:
          CI_BACKEND_ASSIGNEES: ${{ vars.CI_BACKEND_ASSIGNEES }}
          CI_FLUTTER_ASSIGNEES: ${{ vars.CI_FLUTTER_ASSIGNEES }}
          CI_DEFAULT_ASSIGNEES: ${{ vars.CI_DEFAULT_ASSIGNEES }}
          REPORT_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              const runId = process.env.REPORT_RUN_ID;
              if (!/^[1-9][0-9]*$/.test(runId)) {
                throw new Error('run_id must be a positive integer.');
              }
              const { data: run } = await github.rest.actions.getWorkflowRun({
                ...context.repo,
                run_id: runId,
              });
              if (run.name !== 'CI' || run.status !== 'completed' ||
                  !['failure', 'timed_out'].includes(run.conclusion)) {
                throw new Error('Select a completed, failed CI workflow run.');
              }
              context.payload.workflow_run = run;
            }
            const report = require('./.github/scripts/report-ci-failure.cjs');
            await report({ github, context, core });

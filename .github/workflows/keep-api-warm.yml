name: Keep staging API warm

# The staging API runs on Render's free plan, which sleeps after ~15 minutes
# idle and then takes 30-60s to wake. The web app's server-side calls time out
# after 10s, so a sleeping API makes the first sign-in fail. A ping every 10
# minutes keeps it awake.
#
# GitHub only runs scheduled workflows from the default branch (main), and
# pauses them after 60 days without repository activity.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-api-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Override with a repository variable if the staging API moves.
      API_URL: ${{ vars.STAGING_API_URL || 'https://kkfc-demo-api.onrender.com' }}
    steps:
      # /api/docs needs no auth or database and isn't audited, so pings leave no trace in the audit log.
      - name: Ping API
        run: curl -fsS -o /dev/null --max-time 90 --retry 2 --retry-delay 5 -w "HTTP %{http_code} in %{time_total}s\n" "$API_URL/api/docs"

name: CI reporter tests

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/**
      - .github/workflows/ci-failure-issues.yml
      - .github/workflows/ci-reporter-tests.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/**
      - .github/workflows/ci-failure-issues.yml
      - .github/workflows/ci-reporter-tests.yml

permissions:
  contents: read

jobs:
  test:
    # main currently contains only repository automation. This test job is its
    # CI gate; retain a single job named CI when application CI reaches main.
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/scripts/*.test.cjs
